title: "ФОРМУЛА ИЗМЕНЕНИЙ – тренажер и самодиагностика"

central_idea:
  formula: "C = D × V × F > R"
  description: "Изменение = (Неудовлетворённость × Видение × Первые шаги) > Сопротивление"
  sources:
    - "Formula for Change (Gleicher/Beckhard/Harris, Dannemiller Group)"
    - "Fogg Behavior Model (BJ Fogg): Motivation × Ability × Prompt"
    - "Kurt Lewin: модель полей сил"

self_diagnosis:
  quick:
    description: "Оценка по шкале 0–10"
    factors:
      D:
        name: "Неудовлетворённость"
        question: "Насколько мне реально БОЛЬНО оставаться как есть?"
        scale:
          "0–3": "«Вроде норм, но хотелось бы лучше» – слишком низко"
          "4–6": "«Уже надоело, но терпимо» – на грани, мало топлива"
          "7–10": "«Я больше не готов так жить» – достаточно энергии для старта"
        examples:
          low: "D=2: «Да, я просел по доходу и энергии, но как-нибудь вывезу, потом займусь»"
          high: "D=8: «Если я останусь в этом тумане ещё год, я потеряю проект, деньги и ощущение себя»"
        theory:
          - "Motivational Interviewing (Miller & Rollnick)"
          - "Transtheoretical Model (Prochaska & DiClemente)"
          - "Prospect Theory (Kahneman & Tversky)"

      V:
        name: "Видение"
        question: "Вижу ли я КОНКРЕТНО, куда иду и кем становлюсь?"
        scale:
          "0–3": "Абстрактное «хочу лучше, больше денег» – размыто"
          "4–6": "Общее направление есть, но нет картины дня"
          "7–10": "Я вижу конкретный день новой жизни: утро, рабочий процесс, клиенты, деньги, ощущения"
        examples:
          weak: "«Хочу мощный бренд и денег побольше»"
          strong: "«Через год: 100k подписчиков, 2 автоворонки, 1 флагман, 4–6 часов глубокой работы…»"
        theory:
          - "Goal Setting Theory (Locke & Latham)"
          - "Possible Selves (Markus & Nurius)"

      F:
        name: "Первые шаги"
        question: "Знаю ли я ТОЧНО, что делать завтра утром?"
        scale:
          "0–3": "«Не знаю, с чего начать» – действий не будет"
          "4–6": "Есть общее понимание, но нет конкретного первого шага"
          "7–10": "Есть 1–3 конкретных действия на 24–72 часа, реально посильных"
        examples:
          bad: "«Начну развивать YouTube»"
          good:
            - "«Завтра с 11:00 до 12:00 в кофейне дописываю сценарий…»"
            - "«Сегодня до 19:00 записываю один вертикальный ролик…»"
            - "«До конца недели провожу один созвон по новой цене…»"
        theory:
          - "Implementation Intentions (Peter Gollwitzer)"
          - "BJ Fogg: Tiny Habits"

      R:
        name: "Сопротивление"
        question: "Насколько сильно меня тянет НАЗАД?"
        scale:
          "0–3": "Почти нет сопротивления"
          "4–6": "Среднее сопротивление – нужны усилия/поддержка"
          "7–10": "Мощное сопротивление: страхи, усталость, окружение, риски"
        examples:
          - "«Если уберу старый продукт, касса просядет…»"
          - "«Если начну показывать себя, подумают, что выпендриваюсь…»"
        theory:
          - "Kurt Lewin: удерживающие силы"
          - "Oreg et al.: индивидуальные различия в сопротивлении"
          - "Status quo bias, loss aversion"

    calculation:
      steps:
        - "Оцени D, V, F, R по шкале 0–10"
        - "Посчитай D × V × F / 100"
        - "Сравни с R"
      interpretation:
        start_possible: "D × V × F / 100 > R"
        on_the_edge: "D × V × F / 100 ≈ R"
        not_ready: "D × V × F / 100 < R"

  deep:
    D:
      low_signs:
        - "Оправдываю текущее состояние"
        - "Переношу решения на потом"
        - "Рационализирую застой"
        - "Формулировки «хотелось бы»"
      high_signs:
        - "Физически чувствую: «так больше нельзя»"
        - "Вижу, сколько уже потерял"
        - "Готов платить дискомфортом изменений"
        - "Мысль возвращается каждый день"
      strengthening_practices:
        - name: "Реальная цена статус-кво"
          questions:
            - "Сколько времени уже в этом состоянии?"
            - "Что уже потерял?"
            - "Что теряю каждый день?"
            - "Где буду через год?"
            - "Какую версию себя никогда не увижу?"
        - name: "Две линии жизни"
          description: "Сценарий A: ничего не меняю vs Сценарий B: делаю изменения"
        - name: "Позволить себе заскучать"
          description: "Не затыкать дискомфорт, фиксировать моменты «слишком тесно»"
        - name: "Погрузи себя в новый мир"
          description: "Подкасты, конкуренты, люди на целевом уровне"

    V:
      weak_signs:
        - "Фразы без конкретики"
        - "Не могу описать обычный день"
        - "Не понимаю, почему важно лично мне"
      strong_signs:
        - "Подробно описываю день новой жизни"
        - "Чётко понимаю свою новую идентичность"
        - "Чувствую вдохновение + лёгкий страх роста"
      strengthening_practices:
        - name: "Идеальный рабочий день"
          questions:
            - "Во сколько просыпаюсь? Где?"
            - "Что делаю первые 2 часа?"
            - "С кем работаю?"
            - "Как чувствую себя вечером?"
        - name: "Новая идентичность"
          template: "Я человек, который __________. Мои ключевые ценности: __________. Люди обо мне говорят: __________"

    F:
      absent_signs:
        - "Общие формулировки вроде «надо больше работать»"
        - "Не могу сказать, что сделаю завтра в 10:00"
      strong_signs:
        - "Есть 1–3 конкретных действия на 24–72 часа"
        - "Действия маленькие и реально выполнимые"
      formula: "конкретное действие + конкретное время + конкретное место + длительность ≤ 15–30 мин"
      examples:
        - "«Сегодня в 16:00–16:30 на балконе пишу 10 идей видео…»"
        - "«Завтра с 14:00 до 14:20 в коворкинге отвечаю на 5 ЛС…»"
        - "«За 3 дня — созвон с амбассадором…»"

    R:
      internal:
        - "Страх провала"
        - "Страх успеха"
        - "Страх потерять идентичность"
        - "Гомеостаз (тянет в знакомое)"
      external:
        - "Окружение, которое тянет назад"
        - "Объективные ограничения (деньги, время, здоровье)"
      reduction_methods:
        - "Выписать страхи, проработать худший сценарий"
        - "Работа с убеждениями (примеры успешных людей)"
        - "Добавить союзника, минимизировать токсичное окружение"
        - "Дробить изменения на микрошаги"

motivation_types:
  D_from_pain: "краткосрочное топливо"
  V_toward_gain: "долгосрочная устойчивость"
  algorithm:
    - "Этап 1: усилить D до 7–10"
    - "Этап 2 (дни 1–3): использовать D как импульс → сделать F"
    - "Этап 3 (дни 4–7): переключиться в V (новая идентичность)"
    - "Этап 4 (если застрял): кратко вернуться к D, затем снова в V"
  theories:
    - "Prospect Theory (избегание потерь)"
    - "Self-Determination Theory (Deci & Ryan)"

step_by_step_algorithm:
  - "Шаг 1: Определи одно ключевое изменение"
  - "Шаг 2: Оцени D, V, F, R → посчитай D × V × F"
  - "Шаг 3: Найди слабое звено"
  - "Шаг 4: Усиль его практиками"
  - "Шаг 5: При D × V × F / 100 > R — стартуй"
  - "Шаг 6: Еженедельная переоценка"

checklist:
  red_flags:
    - "D ≈ 0"
    - "V ≈ 0 (не могу описать день)"
    - "F ≈ 0 (не знаю, что делать завтра)"
    - "D × V × F / 100 ≤ R"
  yellow_flags: "D, V, F ∈ [4–6], произведение ≈ R"
  green_flags: "D, V, F ∈ [7–10], произведение > R"

common_mistakes:
  - error: "Высокие V и F, но D ≈ 0"
    solution: "Усилить D — увидеть цену статус-кво"
  - error: "Жизнь в постоянной неудовлетворённости"
    solution: "После старта — переключиться в V"
  - error: "Высокое D, но нет V"
    solution: "Сначала сформировать видение"
  - error: "Пытаюсь изменить всё сразу"
    solution: "Одно изменение → микрошаги"
  - error: "Жду идеального момента"
    solution: "Начни с микрошагов в текущих условиях"

navigation_map:
  - "Хочу измениться →"
  - "Быстрая диагностика D,V,F,R →"
  - "Считаю D×V×F →"
  - "Если ≤ R — укрепляю слабое звено →"
  - "Если > R — стартую (фаза D → V) →"
  - "Поддержание из V, краткие возвраты к D при застое"

self_check_questions:
  before_start:
    - "Какое одно изменение?"
    - "Текущие оценки D,V,F,R?"
    - "D×V×F = ? Соотношение с R?"
    - "3 действия за 7 дней для усиления слабого звена?"
    - "Готов ли стартовать честно?"
  weekly:
    - "Как изменились D,V,F,R?"
    - "Где просадка?"
    - "Я в фазе D или V? Не застрял?"
    - "Какие 3 шага на следующую неделю?"

final_rule: |
  Если хотя бы один из D, V, F близок к нулю — результат будет нулевым.
  Найди своё «почти ноль» и работай с ним.
  D — стартер, V — компас, F — рычаг, R — индикатор.
  Даже один конкретный шаг уже меняет линию жизни.